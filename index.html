<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#10131d">
    <title>Scientific Calculator</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="page">
      <section class="calculator" aria-label="Calculator">
        <header class="calculator__header">
          <h1>Calculator</h1>
          <p>Scientific calculator</p>
        </header>

        <div class="calculator__display" aria-label="Calculator display">
          <output class="display__expression" aria-live="polite"></output>
          <output class="display__result" aria-live="polite">0</output>
        </div>

        <div class="calculator__buttons" aria-label="Calculator buttons">
          <button class="button button--utility" type="button" data-action="clear">AC</button>
          <button class="button button--utility" type="button" data-action="delete" aria-label="Delete">DEL</button>
          <button class="button button--utility" type="button" data-action="percent">%</button>
          <button class="button button--operator" type="button" data-operator="/" aria-label="Divide">÷</button>

          <button class="button" type="button" data-number="7">7</button>
          <button class="button" type="button" data-number="8">8</button>
          <button class="button" type="button" data-number="9">9</button>
          <button class="button button--operator" type="button" data-operator="*" aria-label="Multiply">×</button>

          <button class="button" type="button" data-number="4">4</button>
          <button class="button" type="button" data-number="5">5</button>
          <button class="button" type="button" data-number="6">6</button>
          <button class="button button--operator" type="button" data-operator="-" aria-label="Subtract">−</button>

          <button class="button" type="button" data-number="1">1</button>
          <button class="button" type="button" data-number="2">2</button>
          <button class="button" type="button" data-number="3">3</button>
          <button class="button button--operator" type="button" data-operator="+" aria-label="Add">+</button>

          <button class="button button--utility" type="button" data-action="sign" aria-label="Change sign">±</button>
          <button class="button" type="button" data-number="0">0</button>
          <button class="button" type="button" data-action="decimal" aria-label="Decimal point">.</button>
          <button class="button button--equals" type="button" data-action="equals" aria-label="Equals">=</button>
        </div>
      </section>
    </main>
  </body>
</html>
